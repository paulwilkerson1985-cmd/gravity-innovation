<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbkin audio audition</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; background: #14161c; color: #e8e8ee; }
      h1 { font-size: 20px; } h2 { font-size: 15px; margin: 18px 0 6px; color: #9fd3ff; }
      button { min-height: 44px; min-width: 44px; margin: 3px; padding: 6px 12px; border-radius: 8px; border: 1px solid #3a4050; background: #232836; color: inherit; cursor: pointer; }
      button:hover { background: #2f3648; } button.on { background: #2f6f4e; border-color: #4fbf85; }
      label { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; }
      input[type=range] { width: 120px; }
    </style>
  </head>
  <body>
    <h1>Orbkin audio audition (dev only)</h1>
    <p>Click anything to unlock audio. Everything here is synthesized at runtime.</p>
    <div id="app"></div>
    <script type="module" src="/src/audio/audition.ts"></script>
  </body>
</html>
